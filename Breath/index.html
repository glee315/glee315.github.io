<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tide — a breathing space</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@1,6..72,300;1,6..72,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(12, 24, 32, 0.42);
    --glass-line: rgba(255, 255, 255, 0.16);
    --glass-on: rgba(255, 255, 255, 0.16);
    --ink: #F3F8F8;
    --ink-soft: rgba(243, 248, 248, 0.68);
    --accent: #8FD0D6;
    --accent-ink: #0D2E33;
    --fallback-bg: #1C3A44;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --glass: rgba(6, 12, 18, 0.55);
      --glass-line: rgba(255, 255, 255, 0.12);
      --fallback-bg: #0E1C24;
    }
  }
  :root[data-theme="dark"] {
    --glass: rgba(6, 12, 18, 0.55);
    --glass-line: rgba(255, 255, 255, 0.12);
    --fallback-bg: #0E1C24;
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--fallback-bg); color: var(--ink);
    font-family: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene, #photo, .shade, #tide, #crest { position: fixed; inset: 0; width: 100%; height: 100%; }
  #scene { display: block; }
  #photo { object-fit: cover; opacity: 0; transition: opacity 1.2s ease; transform-origin: 50% 60%; max-width: 100%; }
  #photo.on { opacity: 1; }
  .shade { background: radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.35) 100%); pointer-events: none; }
  #tide {
    pointer-events: none;
    background: linear-gradient(180deg, rgba(200,235,240,0.16) 0%, rgba(120,180,195,0.10) 60%, rgba(60,110,125,0.16) 100%);
    backdrop-filter: blur(2px) saturate(1.1); -webkit-backdrop-filter: blur(2px) saturate(1.1);
    clip-path: polygon(0 100%, 100% 100%, 100% 100%, 0 100%);
  }
  #crest { pointer-events: none; }
  #crest path { fill: none; stroke: rgba(255,255,255,0.55); stroke-width: 1.5; }

  .guide {
    position: fixed; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 0 24px 200px; pointer-events: none;
    text-shadow: 0 2px 24px rgba(0,0,0,0.35);
  }
  .cue {
    font-family: "Newsreader", Georgia, "Times New Roman", serif;
    font-style: italic; font-weight: 300;
    font-size: clamp(3rem, 11vw, 7.5rem);
    line-height: 1; letter-spacing: -0.02em; margin: 0;
  }
  .count { margin-top: 1.1rem; font-size: 1.125rem; font-weight: 500; font-variant-numeric: tabular-nums; opacity: 0.8; min-height: 1.5em; }
  .hint { margin: 0.5rem 0 0; font-size: 0.98rem; opacity: 0.85; max-width: 34ch; line-height: 1.5; }

  .controls {
    position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    width: min(600px, calc(100% - 24px));
    background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-line);
    border-radius: 22px; padding: 14px;
    display: grid; gap: 10px;
    transition: opacity .6s ease;
  }
  .controls.dim { opacity: 0.2; }
  .controls.dim:hover, .controls.dim:focus-within { opacity: 1; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .label { font-size: 0.8rem; color: var(--ink-soft); width: 4rem; flex: none; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
  .seg button, .ghost {
    font: inherit; font-size: 0.875rem; font-weight: 500; color: inherit;
    background: transparent; border: 1px solid transparent; border-radius: 999px;
    padding: 7px 12px; cursor: pointer;
  }
  .seg button[aria-pressed="true"], .ghost[aria-pressed="true"] { background: var(--glass-on); border-color: var(--glass-line); }
  .seg button:hover, .ghost:hover { border-color: var(--glass-line); }
  .primary {
    font: inherit; font-weight: 600; font-size: 1rem; border: 0; border-radius: 999px; cursor: pointer;
    padding: 12px 22px; flex: 1 1 140px; background: var(--accent); color: var(--accent-ink);
  }
  .primary:hover { filter: brightness(1.08); }
  .vol { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--ink-soft); }
  input[type="range"] { width: 90px; accent-color: var(--accent); }
  .remaining { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--ink-soft); min-width: 3.2rem; text-align: right; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  @media (max-width: 520px) {
    .label { width: 100%; margin-bottom: -4px; }
    .guide { padding-bottom: 360px; }
    .cue { font-size: clamp(2.6rem, 13vw, 4rem); }
  }
</style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <img id="photo" alt="" aria-hidden="true">
  <div class="shade" aria-hidden="true"></div>
  <div id="tide" aria-hidden="true"></div>
  <svg id="crest" aria-hidden="true" preserveAspectRatio="none"><path id="crestPath" d=""/></svg>

  <div class="guide" aria-hidden="true">
    <p class="cue" id="cue">Breathe</p>
    <div class="count" id="count"></div>
    <p class="hint" id="hint">Pick a rhythm, a place and a sound, then press start. Breathe in as the tide rises and out as it falls.</p>
  </div>
  <div class="sr" aria-live="polite" id="live"></div>

  <div class="controls" id="controls">
    <div class="row"><span class="label">Rhythm</span><div class="seg" id="patterns" role="group" aria-label="Breathing rhythm"></div></div>
    <div class="row"><span class="label">Length</span><div class="seg" id="lengths" role="group" aria-label="Session length"></div></div>
    <div class="row"><span class="label">Place</span><div class="seg" id="scenes" role="group" aria-label="Background"></div></div>
    <div class="row"><span class="label">Sound</span><div class="seg" id="sounds" role="group" aria-label="Background sound"></div></div>
    <div class="row">
      <button class="primary" id="toggle">Start</button>
      <button class="ghost" id="reset" hidden>Stop</button>
      <button class="ghost" id="chimes" aria-pressed="true">Chimes</button>
      <label class="vol">Volume <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7"></label>
      <span class="remaining" id="remaining"></span>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
  </div>

<script>
(() => {
  /* ---------- settings ---------- */
  const PATTERNS = {
    calm:  { name: "Calm 5·5",    desc: "In 5, out 5",                 phases: [["in",5],["out",5]] },
    box:   { name: "Box 4·4·4·4", desc: "In 4, hold 4, out 4, hold 4", phases: [["in",4],["holdTop",4],["out",4],["holdBottom",4]] },
    sleep: { name: "Sleep 4·7·8", desc: "In 4, hold 7, out 8",         phases: [["in",4],["holdTop",7],["out",8]] },
  };
  const LENGTHS = [1, 3, 5, 10];
  const CUES = { in: "Breathe in", out: "Breathe out", holdTop: "Hold", holdBottom: "Hold" };
  const SCENES = {
    dawn:  { name: "Dawn sea",  sun:[0.35,0.045,1], zen:[0.15,0.22,0.48], hor:[1.0,0.56,0.36], sunCol:[1.8,1.0,0.5], water:[0.012,0.035,0.06], cloud:[1.0,0.55,0.42], stars:0, sunSize:0.0007, exposure:1.15 },
    day:   { name: "Open water", sun:[-0.5,0.55,1], zen:[0.08,0.28,0.70], hor:[0.62,0.78,0.92], sunCol:[1.5,1.4,1.2], water:[0.0,0.06,0.10], cloud:[1.0,1.0,1.02], stars:0, sunSize:0.0006, exposure:0.95 },
    night: { name: "Moonlit",   sun:[0.22,0.14,1], zen:[0.003,0.007,0.022], hor:[0.03,0.055,0.10], sunCol:[0.32,0.38,0.52], water:[0.002,0.005,0.01], cloud:[0.05,0.065,0.1], stars:1, sunSize:0.0005, exposure:1.25 },
  };
  const SOUNDS = { ocean: "Waves", rain: "Rain", drone: "Soft tone", off: "Off" };
  const LOW = 0.1, HIGH = 0.8;

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  let pattern = PATTERNS[store.get("tide-pattern")] ? store.get("tide-pattern") : "calm";
  let minutes = Number(store.get("tide-length", 3)) || 3;
  let sceneKey = SCENES[store.get("tide-scene")] ? store.get("tide-scene") : "dawn";
  let soundKey = SOUNDS[store.get("tide-sound")] ? store.get("tide-sound") : "ocean";
  let chimesOn = store.get("tide-chimes", "1") === "1";
  let volume = Number(store.get("tide-volume", 0.7));
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const $ = id => document.getElementById(id);
  const cueEl = $("cue"), countEl = $("count"), hintEl = $("hint"), live = $("live");
  const toggle = $("toggle"), resetBtn = $("reset"), remainingEl = $("remaining"), controls = $("controls");
  const tide = $("tide"), crest = $("crestPath"), photo = $("photo"), canvas = $("scene");
  const DEFAULT_HINT = hintEl.textContent;

  /* ---------- seascape (WebGL) ---------- */
  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  let U = {}, cur = JSON.parse(JSON.stringify(SCENES[sceneKey])), target = SCENES[sceneKey];
  const FRAG = `
  precision highp float;
  uniform vec2 uRes; uniform float uTime, uBreath, uStars, uSunSize, uExposure;
  uniform vec3 uSun, uZen, uHor, uSunCol, uWater, uCloud;
  float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
  float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
    return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
  float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return v; }
  vec3 sky(vec3 rd){
    vec3 sun = normalize(uSun);
    float y = max(rd.y, 0.);
    vec3 c = mix(uHor, uZen, pow(y, .45));
    float s = max(dot(rd, sun), 0.);
    c += uSunCol * (pow(s, 6.)*.22 + pow(s, 60.)*.45);
    c += uSunCol * 8. * smoothstep(1.-uSunSize, 1.-uSunSize*.4, s);
    if (uStars > 0.) {
      vec2 sc = vec2(atan(rd.x, rd.z), asin(clamp(rd.y,-1.,1.))) * 220.;
      vec2 id = floor(sc); float h = hash(id);
      float st = step(.993, h) * smoothstep(.28, 0., length(fract(sc)-.5));
      st *= .6 + .4*sin(uTime*2. + h*80.);
      c += vec3(.9,.95,1.) * st * uStars * smoothstep(.02,.25,rd.y) * 1.4;
    }
    if (rd.y > 0.) {
      vec2 cp = rd.xz / (rd.y + .09) * .9 + vec2(uTime*.012, uTime*.004);
      float cl = smoothstep(.48, .9, fbm(cp));
      vec3 cc = uCloud * (.55 + .7*pow(s, 3.)) + uSunCol*.15*pow(s,12.);
      c = mix(c, cc, cl * .6 * smoothstep(0., .12, rd.y));
    }
    return c;
  }
  void main(){
    vec2 uv = (gl_FragCoord.xy - .5*uRes) / uRes.y;
    vec3 ro = vec3(0., 1.8 + uBreath*.9, 0.);
    vec3 rd = normalize(vec3(uv.x, uv.y + .02, 1.25));
    vec3 col;
    if (rd.y >= 0.) { col = sky(rd); }
    else {
      float t = -ro.y / rd.y;
      vec3 p = ro + rd*t;
      vec2 g = vec2(0.);
      float amp = .75 + uBreath*.55;
      for (int i = 0; i < 9; i++) {
        float fi = float(i);
        float a = fi*1.71 + .4;
        vec2 dir = vec2(cos(a), sin(a)*.6 + .4);
        dir = normalize(dir);
        float f = .14 * pow(1.6, fi);
        float A = .32 / pow(1.85, fi) * amp * exp(-t*f*.018);
        float ph = dot(dir, p.xz)*f + uTime*sqrt(9.8*f);
        g += A * f * cos(ph) * dir;
      }
      vec2 dp = p.xz*1.6 + uTime*vec2(.25,.4);
      float d = exp(-t*.06);
      g += (vec2(fbm(dp+vec2(.05,0.)), fbm(dp+vec2(0.,.05))) - fbm(dp)) * 2.4 * d;
      vec3 n = normalize(vec3(-g.x, 1., -g.y));
      vec3 refl = reflect(rd, n); refl.y = abs(refl.y);
      float fr = .02 + .98*pow(1. - max(dot(n, -rd), 0.), 5.);
      vec3 sun = normalize(uSun);
      vec3 body = uWater * (1. + 2.5*max(dot(n, sun), 0.)) + uSunCol*.012;
      col = mix(body, sky(refl), fr);
      col += uSunCol * (pow(max(dot(refl, sun), 0.), 500.)*6. + pow(max(dot(refl, sun), 0.), 60.)*.25);
      vec3 fog = sky(normalize(vec3(rd.x, .002, rd.z)));
      col = mix(col, fog, 1. - exp(-t*.0035));
    }
    col = 1. - exp(-col * uExposure);
    col = pow(col, vec3(.4545));
    float vg = smoothstep(1.3, .3, length(uv*vec2(.8,1.)));
    col *= .82 + .18*vg;
    gl_FragColor = vec4(col, 1.);
  }`;
  function initGL() {
    if (!gl) return false;
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; } return s; };
    const vs = sh(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }");
    const fs = sh(gl.FRAGMENT_SHADER, FRAG);
    if (!vs || !fs) return false;
    const prog = gl.createProgram(); gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return false;
    gl.useProgram(prog);
    const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, "p"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    ["uRes","uTime","uBreath","uStars","uSunSize","uExposure","uSun","uZen","uHor","uSunCol","uWater","uCloud"].forEach(n => U[n] = gl.getUniformLocation(prog, n));
    return true;
  }
  const glOK = initGL();
  function sizeCanvas() {
    const scale = Math.min(window.devicePixelRatio || 1, 1.5) * (innerWidth < 700 ? 0.6 : 0.75);
    canvas.width = Math.round(innerWidth * scale); canvas.height = Math.round(innerHeight * scale);
    if (glOK) gl.viewport(0, 0, canvas.width, canvas.height);
  }
  sizeCanvas();
  const lerpScene = k => {
    for (const key of ["sun","zen","hor","sunCol","water","cloud"]) cur[key] = cur[key].map((v,i) => v + (target[key][i]-v)*k);
    for (const key of ["stars","sunSize","exposure"]) cur[key] += (target[key]-cur[key])*k;
  };
  function renderScene(time, breath) {
    if (!glOK || sceneKey === "photo") return;
    const dt = Math.min(0.1, time - (renderScene.last || time)); renderScene.last = time; lerpScene(1 - Math.exp(-dt*2.2));
    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, time * (reduceMotion ? 0.35 : 1));
    gl.uniform1f(U.uBreath, reduceMotion ? breath*0.3 : breath);
    gl.uniform1f(U.uStars, cur.stars); gl.uniform1f(U.uSunSize, cur.sunSize); gl.uniform1f(U.uExposure, cur.exposure);
    gl.uniform3fv(U.uSun, cur.sun); gl.uniform3fv(U.uZen, cur.zen); gl.uniform3fv(U.uHor, cur.hor);
    gl.uniform3fv(U.uSunCol, cur.sunCol); gl.uniform3fv(U.uWater, cur.water); gl.uniform3fv(U.uCloud, cur.cloud);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  /* ---------- sound (Web Audio) ---------- */
  let ctx = null, master = null, bed = null;
  function ensureAudio() {
    if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC(); master = ctx.createGain(); master.gain.value = volume; master.connect(ctx.destination);
    startBed();
  }
  function noiseBuffer(kind) {
    const len = ctx.sampleRate * 6, buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch); let last = 0;
      for (let i = 0; i < len; i++) {
        const w = Math.random()*2 - 1;
        if (kind === "brown") { last = (last + 0.02*w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
      }
    }
    return buf;
  }
  function stopBed() {
    if (!bed) return;
    const b = bed; bed = null;
    b.out.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
    setTimeout(() => b.nodes.forEach(n => { try { n.stop(); } catch {} try { n.disconnect(); } catch {} }), 2000);
  }
  function startBed() {
    if (!ctx) return;
    stopBed();
    if (soundKey === "off") return;
    const out = ctx.createGain(); out.gain.value = 0; out.connect(master);
    const nodes = [out]; let drive;
    if (soundKey === "ocean") {
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer("brown"); src.loop = true;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 500; lp.Q.value = 0.4;
      const swell = ctx.createGain(); swell.gain.value = 0.4;
      const hiss = ctx.createBufferSource(); hiss.buffer = noiseBuffer("white"); hiss.loop = true;
      const hp = ctx.createBiquadFilter(); hp.type = "bandpass"; hp.frequency.value = 3500; hp.Q.value = 0.5;
      const hissG = ctx.createGain(); hissG.gain.value = 0.0;
      src.connect(lp).connect(swell).connect(out); hiss.connect(hp).connect(hissG).connect(out);
      src.start(); hiss.start(); nodes.push(src, hiss, lp, swell, hp, hissG);
      drive = lv => { const t = ctx.currentTime;
        lp.frequency.setTargetAtTime(280 + 1100*lv, t, 0.25);
        swell.gain.setTargetAtTime(0.25 + 0.75*lv, t, 0.25);
        hissG.gain.setTargetAtTime(0.012 + 0.05*lv*lv, t, 0.3); };
      out.gain.setTargetAtTime(0.9, ctx.currentTime, 1.2);
    } else if (soundKey === "rain") {
      const src = ctx.createBufferSource(); src.buffer = noiseBuffer("white"); src.loop = true;
      const hp = ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 900;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 7000;
      const g = ctx.createGain(); g.gain.value = 0.14;
      const rum = ctx.createBufferSource(); rum.buffer = noiseBuffer("brown"); rum.loop = true;
      const rlp = ctx.createBiquadFilter(); rlp.type = "lowpass"; rlp.frequency.value = 220;
      const rg = ctx.createGain(); rg.gain.value = 0.35;
      src.connect(hp).connect(lp).connect(g).connect(out); rum.connect(rlp).connect(rg).connect(out);
      src.start(); rum.start(); nodes.push(src, rum, hp, lp, g, rlp, rg);
      // scattered droplets
      const drip = () => { if (!bed || bed.out !== out) return;
        const o = ctx.createOscillator(), dg = ctx.createGain(), t = ctx.currentTime;
        o.type = "sine"; o.frequency.setValueAtTime(1800 + Math.random()*2200, t); o.frequency.exponentialRampToValueAtTime(500, t+0.05);
        dg.gain.setValueAtTime(0.0001, t); dg.gain.exponentialRampToValueAtTime(0.03*Math.random()+0.005, t+0.004); dg.gain.exponentialRampToValueAtTime(0.0001, t+0.07);
        o.connect(dg).connect(out); o.start(t); o.stop(t+0.08);
        setTimeout(drip, 60 + Math.random()*260); };
      setTimeout(drip, 300);
      drive = lv => { lp.frequency.setTargetAtTime(4500 + 3500*lv, ctx.currentTime, 0.4); };
      out.gain.setTargetAtTime(0.9, ctx.currentTime, 1.2);
    } else if (soundKey === "drone") {
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 600; lp.Q.value = 0.7;
      lp.connect(out); nodes.push(lp);
      [110, 164.81, 220, 277.18, 329.63].forEach((f, i) => {
        const o = ctx.createOscillator(), g = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        o.type = i < 2 ? "sine" : "triangle"; o.frequency.value = f; o.detune.value = (Math.random()-0.5)*8;
        g.gain.value = [0.22, 0.16, 0.12, 0.06, 0.05][i];
        lfo.frequency.value = 0.05 + Math.random()*0.08; lg.gain.value = g.gain.value*0.5;
        lfo.connect(lg).connect(g.gain); o.connect(g).connect(lp); o.start(); lfo.start(); nodes.push(o, g, lfo, lg);
      });
      drive = lv => { lp.frequency.setTargetAtTime(350 + 1500*lv, ctx.currentTime, 0.3); };
      out.gain.setTargetAtTime(0.6, ctx.currentTime, 1.5);
    }
    bed = { out, nodes, drive };
  }
  function bell(freq, gainAmt = 0.18, decay = 3.2) {
    if (!ctx || !chimesOn) return;
    const t = ctx.currentTime;
    [[1, 1], [2.76, 0.35], [5.4, 0.12], [8.93, 0.05]].forEach(([m, a]) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = "sine"; o.frequency.value = freq * m;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(gainAmt*a, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + decay / Math.sqrt(m));
      o.connect(g).connect(master); o.start(t); o.stop(t + decay + 0.1);
    });
  }
  const PHASE_TONES = { in: 659.25, out: 440, holdTop: 587.33, holdBottom: 493.88 };

  /* ---------- controls ---------- */
  function buildSeg(el, items, current, onPick) {
    el.innerHTML = "";
    items.forEach(([key, label, title]) => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; b.dataset.key = key; if (title) b.title = title;
      b.setAttribute("aria-pressed", String(key == current));
      b.onclick = () => { if (onPick(key) !== false) [...el.children].forEach(c => c.setAttribute("aria-pressed", String(c === b))); };
      el.appendChild(b);
    });
  }
  buildSeg($("patterns"), Object.entries(PATTERNS).map(([k,p]) => [k, p.name, p.desc]), pattern,
    k => { pattern = k; store.set("tide-pattern", k); if (running || elapsedBefore) stop(); });
  buildSeg($("lengths"), LENGTHS.map(m => [m, `${m} min`]), minutes,
    m => { minutes = m; store.set("tide-length", m); updateRemaining(elapsed()); });
  const sceneItems = Object.entries(SCENES).map(([k,s]) => [k, s.name]);
  sceneItems.push(["photo", "Your photo", "Use a picture from your device"]);
  buildSeg($("scenes"), sceneItems, sceneKey, k => {
    if (k === "photo") { $("file").click(); return false; }
    setScene(k); store.set("tide-scene", k);
  });
  buildSeg($("sounds"), Object.entries(SOUNDS), soundKey, k => {
    soundKey = k; store.set("tide-sound", k); ensureAudio(); startBed();
  });
  const chimeBtn = $("chimes");
  chimeBtn.setAttribute("aria-pressed", String(chimesOn));
  chimeBtn.onclick = () => { chimesOn = !chimesOn; chimeBtn.setAttribute("aria-pressed", String(chimesOn)); store.set("tide-chimes", chimesOn ? "1" : "0"); if (chimesOn) { ensureAudio(); bell(659.25, 0.12, 2); } };
  const volEl = $("volume"); volEl.value = volume;
  volEl.oninput = () => { volume = Number(volEl.value); store.set("tide-volume", volume); if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.05); };

  function setScene(k) {
    sceneKey = k;
    if (k === "photo") { photo.classList.add("on"); canvas.style.visibility = "hidden"; }
    else { target = SCENES[k]; photo.classList.remove("on"); canvas.style.visibility = glOK ? "visible" : "hidden"; }
    [...$("scenes").children].forEach(c => c.setAttribute("aria-pressed", String(c.dataset.key === k)));
  }
  $("file").onchange = e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (photo.src) URL.revokeObjectURL(photo.src);
    photo.src = URL.createObjectURL(f);
    photo.onload = () => setScene("photo");
    e.target.value = "";
  };
  if (sceneKey === "photo") sceneKey = "dawn";
  if (!glOK) document.body.style.background = "linear-gradient(180deg,#3a5a7a 0%,#e8a07a 48%,#1d3a48 52%,#0b1f28 100%)";
  setScene(sceneKey);

  /* ---------- breathing engine ---------- */
  let running = false, startedAt = 0, elapsedBefore = 0, lastKey = "", breaths = 0, level = LOW, finished = false;
  const ease = t => 0.5 - 0.5*Math.cos(Math.PI*t);
  const fmt = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; };
  const cycleLen = () => PATTERNS[pattern].phases.reduce((a,p) => a+p[1], 0);
  function elapsed() { return elapsedBefore + (running ? (performance.now()-startedAt)/1000 : 0); }
  function updateRemaining(e) { remainingEl.textContent = fmt(minutes*60 - e); }
  function phaseAt(e) {
    const ph = PATTERNS[pattern].phases, cyc = cycleLen();
    let t = e % cyc, idx = 0;
    while (t >= ph[idx][1]) { t -= ph[idx][1]; idx++; }
    return { kind: ph[idx][0], dur: ph[idx][1], t, idx, n: Math.floor(e/cyc) };
  }

  function drawTide(lv, time) {
    const w = innerWidth, h = innerHeight, y = h*(1-lv), amp = reduceMotion ? 0 : 6, N = 28;
    const pts = [], dpts = [];
    for (let i = 0; i <= N; i++) {
      const x = i/N;
      const wy = y + Math.sin(x*Math.PI*2.2 + time*0.9)*amp + Math.sin(x*Math.PI*5.1 - time*1.3)*amp*0.4;
      pts.push(`${(x*100).toFixed(2)}% ${wy.toFixed(1)}px`);
      dpts.push(`${(x*w).toFixed(1)},${wy.toFixed(1)}`);
    }
    tide.style.clipPath = `polygon(0 100%, 100% 100%, ${pts.reverse().join(", ")})`;
    crest.setAttribute("d", "M" + dpts.join(" L"));
  }

  let idleLevel = LOW;
  function frame(now) {
    const time = now/1000;
    if (running) {
      const e = elapsed(), p = phaseAt(e), prog = p.t/p.dur;
      if (p.kind === "in") level = LOW + (HIGH-LOW)*ease(prog);
      else if (p.kind === "out") level = HIGH - (HIGH-LOW)*ease(prog);
      else level = p.kind === "holdTop" ? HIGH : LOW;
      const key = `${p.n}-${p.idx}`;
      if (key !== lastKey) {
        lastKey = key; cueEl.textContent = CUES[p.kind]; live.textContent = CUES[p.kind];
        bell(PHASE_TONES[p.kind], p.kind.startsWith("hold") ? 0.1 : 0.16);
        if (p.kind === "in") breaths = p.n + 1;
      }
      countEl.textContent = String(Math.ceil(p.dur - p.t));
      updateRemaining(e);
      if (e >= Math.ceil(minutes*60/cycleLen())*cycleLen()) finish();
    } else {
      // gentle resting swell when idle
      idleLevel = LOW + 0.03 + Math.sin(time*0.6)*0.02;
      level += (idleLevel - level)*0.04;
    }
    const breath = (level-LOW)/(HIGH-LOW);
    drawTide(level, time);
    renderScene(time, breath);
    if (sceneKey === "photo" && !reduceMotion) photo.style.transform = `scale(${(1.02 + 0.05*breath).toFixed(4)})`;
    if (bed && bed.drive) bed.drive(running ? breath : 0.25 + Math.sin(time*0.5)*0.15);
    requestAnimationFrame(frame);
  }

  function start() {
    ensureAudio();
    if (!elapsedBefore) { breaths = 0; lastKey = ""; }
    running = true; finished = false; startedAt = performance.now();
    toggle.textContent = "Pause"; resetBtn.hidden = false;
    hintEl.textContent = ""; controls.classList.add("dim");
    requestWake();
    if (document.activeElement) document.activeElement.blur();
  }
  function pause() {
    elapsedBefore = elapsed(); running = false;
    toggle.textContent = "Resume"; cueEl.textContent = "Paused"; countEl.textContent = "";
    controls.classList.remove("dim"); releaseWake();
  }
  function stop() {
    running = false; elapsedBefore = 0; lastKey = "";
    toggle.textContent = "Start"; resetBtn.hidden = true;
    cueEl.textContent = "Breathe"; countEl.textContent = ""; hintEl.textContent = DEFAULT_HINT;
    controls.classList.remove("dim"); releaseWake(); updateRemaining(0);
  }
  function finish() {
    const n = breaths, m = minutes;
    stop();
    cueEl.textContent = "Well done";
    hintEl.textContent = `You took ${n} slow breath${n === 1 ? "" : "s"} over ${m} minute${m === 1 ? "" : "s"}. Notice how you feel before moving on.`;
    live.textContent = "Session complete"; toggle.textContent = "Start again";
    if (ctx && chimesOn) { bell(440, 0.14, 4); setTimeout(() => bell(554.37, 0.12, 4), 450); setTimeout(() => bell(659.25, 0.12, 5), 900); }
  }

  toggle.onclick = () => (running ? pause() : start());
  resetBtn.onclick = stop;
  document.addEventListener("keydown", ev => {
    if (ev.code === "Space" && !(ev.target instanceof HTMLButtonElement) && !(ev.target instanceof HTMLInputElement)) { ev.preventDefault(); toggle.click(); }
    if (ev.key === "Escape" && (running || elapsedBefore)) stop();
  });

  let wake = null;
  async function requestWake() { try { wake = await navigator.wakeLock?.request("screen"); } catch {} }
  function releaseWake() { try { wake?.release(); } catch {} wake = null; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running) requestWake(); });
  window.addEventListener("resize", sizeCanvas);

  updateRemaining(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
